name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyzer:
    name: Analyzer (core + real PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract, ghostscript, Java for tabula)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ghostscript default-jre-headless

      - name: Install Python deps
        working-directory: analyzer
        run: pip install -r requirements.txt

      - name: Fetch real Novo Nordisk report for integration tests
        working-directory: analyzer
        run: python scripts/download_sample.py

      - name: Run analyzer + shared-core tests (incl. real report)
        working-directory: analyzer
        run: python -m unittest discover -s tests -v

  anonymizer:
    name: Anonymizer (pure redaction engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run anonymizer tests
        working-directory: anonymizer
        run: python -m unittest test_redactor -v